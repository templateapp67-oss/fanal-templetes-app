# ============================================================================
# Deploy guard.
#
# Vercel deploys every push of this repository to the `fanal-templetes-app` and
# `nexora-shop-owner-pwa` projects. When an intermediate commit does not build
# (the 2026-09-28 Referral History drift: a page importing
# `fetchMyPartnerReferredSalons`, which `src/lib/growthPartner.ts` never
# exported), `vite build` fails, the Vercel deployment is marked "Deployment has
# failed", and the branch looks undeployed even though `main` is healthy.
#
# Vercel does not typecheck, so a broken type/import graph can sit on a branch
# until the deploy fails. This workflow runs the two things a deploy needs —
# `tsc --noEmit` and the exact production build command from vercel.json —
# plus the complete backend/migration and component interaction suites.
# Node 22 and bounded workers keep PostgreSQL/WASM tests reproducible.
# ============================================================================
name: Deploy guard

on:
  push:
  pull_request:

concurrency:
  group: deploy-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, backend and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # package-lock.json is intentionally git-ignored (the repo ships
      # bun.lock); install fresh, the same way a Vercel build resolves deps.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Production build (vite build + server bundle)
        run: npm run build

      - name: Complete backend and migration suite
        run: npm test

      - name: Booking, contact validation and referral regressions
        run: npm run test:checkout

      - name: Complete component interaction suite
        run: npm run test:dom
