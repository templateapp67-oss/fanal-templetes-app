# ============================================================================
# Deploy guard.
#
# Vercel deploys every push of this repository to the `fanal-templetes-app` and
# `nexora-shop-owner-pwa` projects. When an intermediate commit does not build
# (the 2026-09-28 Referral History drift: a page importing
# `fetchMyPartnerReferredSalons`, which `src/lib/growthPartner.ts` never
# exported), `vite build` fails, the Vercel deployment is marked "Deployment has
# failed", and the branch looks undeployed even though `main` is healthy.
#
# Vercel does not typecheck, so a broken type/import graph can sit on a branch
# until the deploy fails. This workflow runs the two things a deploy needs —
# `tsc --noEmit` and the exact production build command from vercel.json —
# plus the router/partner-section suites that pin the registry invariants.
# Keep it fast and deterministic: it must never be red on `main`.
# ============================================================================
name: Deploy guard

on:
  push:
  pull_request:

concurrency:
  group: deploy-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build and section-registry tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # package-lock.json is intentionally git-ignored (the repo ships
      # bun.lock); install fresh, the same way a Vercel build resolves deps.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Production build (vite build + server bundle)
        run: npm run build

      # middlewareEdgeSafety pins the root middleware invariant: Vercel builds
      # middleware.ts per-file for the Edge runtime, so a single local import
      # makes the module fail to LOAD and every matched route answers
      # 500 MIDDLEWARE_INVOCATION_FAILED (see MIDDLEWARE_500_FIX.md).
      - name: Router / partner-section registry tests
        run: >
          node --import ./scripts/testEnv.mjs --import tsx --test
          --disable-warning=ExperimentalWarning
          tests/routerSectionRegistry.test.ts
          tests/partnerReferralHistory.test.ts
          tests/partnerPortalShell.test.ts
          tests/growthPartnerPage.test.ts
          tests/growthPartnerShell.test.ts
          tests/middlewareEdgeSafety.test.ts
          tests/partnerEdgeRouting.test.ts

      - name: Booking, contact validation and referral regressions
        run: npm run test:checkout

      - name: Complete component interaction suite
        run: npm run test:dom
