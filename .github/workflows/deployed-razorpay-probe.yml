name: Deployed Razorpay first-failure probe

on:
  push:
    branches:
      - arena/01a0b57b-fanal-templetes-app
    paths:
      - .github/workflows/deployed-razorpay-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe deployed API without exposing credentials
        env:
          BASE_URL: https://fanal-templetes-app.vercel.app
        run: |
          node <<'NODE'
          const base = process.env.BASE_URL.replace(/\/$/, '');

          function sanitize(value, key = '') {
            if (/secret|signature|authorization|token|password/i.test(key)) {
              return value ? '[REDACTED]' : value;
            }
            if (typeof value === 'string') {
              return value
                .replace(/rzp_(test|live)_[A-Za-z0-9]+/g, 'rzp_$1_[REDACTED]')
                .replace(/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/g, '[REDACTED-JWT]');
            }
            if (Array.isArray(value)) return value.map((item) => sanitize(item));
            if (value && typeof value === 'object') {
              return Object.fromEntries(Object.entries(value).map(([k, v]) => [k, sanitize(v, k)]));
            }
            return value;
          }

          async function request(label, path, init = {}) {
            const response = await fetch(base + path, {
              redirect: 'manual',
              signal: AbortSignal.timeout(20_000),
              ...init,
            });
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); }
            catch { body = { nonJson: text.slice(0, 300) }; }
            console.log(JSON.stringify({
              label,
              method: init.method || 'GET',
              path,
              httpStatus: response.status,
              contentType: response.headers.get('content-type'),
              body: sanitize(body),
            }, null, 2));
            return { response, body };
          }

          await request('credential configuration', '/api/payments/razorpay/config', {
            headers: { accept: 'application/json' },
          });

          await request('first order request: exact ₹1 legacy payload, no fabricated session', '/api/payments/razorpay/order', {
            method: 'POST',
            headers: { accept: 'application/json', 'content-type': 'application/json' },
            body: JSON.stringify({
              amount: 1,
              currency: 'INR',
              receipt: `arena-probe-${Date.now()}`,
            }),
          });

          await request('safe unsigned webhook transport probe', '/api/payments/razorpay/webhook', {
            method: 'POST',
            headers: { accept: 'application/json', 'content-type': 'application/json' },
            body: JSON.stringify({ event: 'arena.safe_probe', payload: {} }),
          });
          NODE
